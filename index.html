<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="PropushHub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--seo-preload-->
    <script>
      // Home page only: show the PPH loading screen on every full page load, then let it exit once the
      // page has loaded (but not before the letters have drawn). Skipped for reduced motion and crawlers.
      (function () {
        try {
          var root = document.documentElement;
          if (location.pathname !== '/') return;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (/bot|crawl|spider|slurp|prerender|headless/i.test(navigator.userAgent)) return;
          root.classList.add('splash');
          var start = Date.now();
          var exited = false;
          var exit = function () {
            if (exited) return;
            exited = true;
            setTimeout(function () { root.classList.add('splash-exit'); }, Math.max(0, 1150 - (Date.now() - start)));
          };
          if (document.readyState === 'complete') exit(); else addEventListener('load', exit);
          setTimeout(exit, 4000);
        } catch (e) {}
      })();
    </script>
    <!--seo-head-start-->
    <title>PropushHub — Web, Mobile & Custom Software Development</title>
    <meta name="description" content="PropushHub builds websites, CMS, e-commerce, mobile apps, desktop software and custom ERP. One team from design to launch and support. Get a free quote." />
    <!--seo-head-end-->
  </head>
  <body class="bg-ink text-fg antialiased">
    <div id="root"><!--seo-root--></div>
    <!--seo-data-->
    <noscript>PropushHub builds websites, CMS, mobile apps, desktop software and custom ERP. Please enable JavaScript for the full experience.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
