<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#0F172A"/>
  <!-- Mobile Screen 1: Conversations List -->
  <rect x="110" y="48" width="330" height="654" rx="28" fill="#1E293B" stroke="#334155" stroke-width="4"/>
  <rect x="126" y="80" width="298" height="590" rx="18" fill="#FFFFFF"/>
  <text x="150" y="124" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="700">TalkBridge</text>
  <text x="150" y="144" fill="#64748B" font-family="monospace" font-size="11">React Native · TypeScript</text>

  <rect x="150" y="168" width="250" height="34" rx="6" fill="#F1F5F9"/>
  <text x="166" y="189" fill="#64748B" font-family="sans-serif" font-size="12">Search conversations...</text>

  <rect x="150" y="220" width="250" height="68" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="180" cy="254" r="16" fill="#1D4ED8"/>
  <text x="208" y="248" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Engineering Team</text>
  <text x="208" y="268" fill="#475569" font-family="sans-serif" font-size="11">Socket.io real-time channel</text>

  <rect x="150" y="302" width="250" height="68" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="180" cy="336" r="16" fill="#334155"/>
  <text x="208" y="330" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Product Design Sync</text>
  <text x="208" y="350" fill="#64748B" font-family="sans-serif" font-size="11">Direct &amp; group messaging</text>

  <!-- Mobile Screen 2: Active Chat Interface -->
  <rect x="480" y="48" width="330" height="654" rx="28" fill="#1E293B" stroke="#334155" stroke-width="4"/>
  <rect x="496" y="80" width="298" height="590" rx="18" fill="#F8FAFC"/>
  <rect x="496" y="80" width="298" height="64" rx="18" fill="#0F172A"/>
  <text x="524" y="114" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Engineering Team</text>
  <text x="524" y="132" fill="#94A3B8" font-family="monospace" font-size="10">Connected · Cross-Platform UI</text>

  <rect x="516" y="168" width="210" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="532" y="194" fill="#0F172A" font-family="sans-serif" font-size="12">Android &amp; iOS builds configured</text>
  <text x="532" y="214" fill="#64748B" font-family="sans-serif" font-size="11">with React Native 0.83 &amp; TS 5.8</text>

  <rect x="564" y="252" width="210" height="64" rx="10" fill="#1D4ED8"/>
  <text x="580" y="278" fill="#FFFFFF" font-family="sans-serif" font-size="12">Backend paired with Node.js,</text>
  <text x="580" y="298" fill="#DBEAFE" font-family="sans-serif" font-size="11">Express, Socket.io &amp; MongoDB</text>

  <rect x="516" y="606" width="258" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="532" y="631" fill="#64748B" font-family="sans-serif" font-size="12">Write a message...</text>

  <!-- Right Panel: Architecture Summary -->
  <rect x="850" y="48" width="290" height="654" rx="12" fill="#1E293B"/>
  <text x="878" y="98" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="700">TalkBridge Stack</text>
  <line x1="878" y1="118" x2="1112" y2="118" stroke="#334155"/>
  <text x="878" y="154" fill="#60A5FA" font-family="monospace" font-size="12">MOBILE CLIENT</text>
  <text x="878" y="180" fill="#E2E8F0" font-family="sans-serif" font-size="13">• React Native 0.83</text>
  <text x="878" y="204" fill="#E2E8F0" font-family="sans-serif" font-size="13">• TypeScript 5.8</text>
  <text x="878" y="228" fill="#E2E8F0" font-family="sans-serif" font-size="13">• Safe-Area Context UI</text>
  <text x="878" y="252" fill="#E2E8F0" font-family="sans-serif" font-size="13">• Android &amp; iOS Native CLI</text>

  <text x="878" y="310" fill="#60A5FA" font-family="monospace" font-size="12">COMPANION ECOSYSTEM</text>
  <text x="878" y="336" fill="#E2E8F0" font-family="sans-serif" font-size="13">• Talkbridge-ChatApp-Backend</text>
  <text x="878" y="360" fill="#94A3B8" font-family="sans-serif" font-size="12">  Node.js, Express, Socket.io,</text>
  <text x="878" y="380" fill="#94A3B8" font-family="sans-serif" font-size="12">  MongoDB &amp; JWT Auth</text>
  <text x="878" y="412" fill="#E2E8F0" font-family="sans-serif" font-size="13">• Talkbridge-ChatApp-Frontend</text>
  <text x="878" y="436" fill="#94A3B8" font-family="sans-serif" font-size="12">  React + TypeScript + Vite</text>
</svg>
