<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#0F172A"/>
  <!-- Left: Mobile Offline Field Capture Client -->
  <rect x="56" y="36" width="356" height="678" rx="28" fill="#1E293B" stroke="#334155" stroke-width="4"/>
  <rect x="72" y="68" width="324" height="614" rx="18" fill="#FFFFFF"/>
  <text x="96" y="112" fill="#0F172A" font-family="sans-serif" font-size="17" font-weight="700">FieldCapture</text>
  <text x="96" y="132" fill="#64748B" font-family="monospace" font-size="11">SQLite Local-First · Sync Manager</text>

  <rect x="96" y="152" width="276" height="140" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="112" y="180" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Record Material Delivery</text>
  <text x="112" y="204" fill="#475569" font-family="sans-serif" font-size="11">• Physical Ticket Photo (Local URI)</text>
  <text x="112" y="226" fill="#475569" font-family="sans-serif" font-size="11">• Supplier &amp; Purchase Order Data</text>
  <text x="112" y="248" fill="#475569" font-family="sans-serif" font-size="11">• UUIDv4 Idempotency Key Generated</text>

  <rect x="96" y="310" width="276" height="210" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="112" y="338" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="700">Offline Sync Queue States</text>
  <rect x="112" y="354" width="244" height="34" rx="4" fill="#FEF3C7"/>
  <text x="124" y="376" fill="#92400E" font-family="monospace" font-size="11">STATUS: QUEUED (Local SQLite)</text>
  <rect x="112" y="398" width="244" height="34" rx="4" fill="#DBEAFE"/>
  <text x="124" y="420" fill="#1E40AF" font-family="monospace" font-size="11">STATUS: UPLOADING (Multipart)</text>
  <rect x="112" y="442" width="244" height="34" rx="4" fill="#DCFCE7"/>
  <text x="124" y="464" fill="#166534" font-family="monospace" font-size="11">STATUS: SYNCED (PostgreSQL)</text>

  <rect x="96" y="538" width="276" height="120" rx="8" fill="#0F172A"/>
  <text x="112" y="566" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Built-In Resilience Testing Suite</text>
  <text x="112" y="590" fill="#94A3B8" font-family="monospace" font-size="11">• Forced Offline / Online Mode</text>
  <text x="112" y="610" fill="#94A3B8" font-family="monospace" font-size="11">• Simulated HTTP 500 Outage</text>
  <text x="112" y="630" fill="#94A3B8" font-family="monospace" font-size="11">• App-Restart Crash Recovery</text>

  <!-- Right: Offline-to-PostgreSQL Architecture Flow -->
  <rect x="448" y="36" width="696" height="678" rx="10" fill="#F8FAFC"/>
  <text x="484" y="88" fill="#0F172A" font-family="sans-serif" font-size="22" font-weight="700">Offline-First Material Delivery Architecture</text>
  <text x="484" y="112" fill="#64748B" font-family="sans-serif" font-size="13">Engineered for construction job sites with intermittent or zero cellular connectivity</text>

  <rect x="484" y="146" width="624" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="512" y="182" fill="#1D4ED8" font-family="monospace" font-size="12">01. ON-DEVICE PERSISTENCE LAYER</text>
  <text x="512" y="210" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="700">Local SQLite Database + Sandboxed Photo Storage</text>
  <text x="512" y="236" fill="#475569" font-family="sans-serif" font-size="13">Every delivery ticket photo and PO record is committed locally before any network request</text>
  <text x="512" y="258" fill="#475569" font-family="sans-serif" font-size="13">is attempted. Interrupted uploads recover automatically on app restart.</text>

  <rect x="484" y="318" width="624" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="512" y="354" fill="#1D4ED8" font-family="monospace" font-size="12">02. AUTOMATIC SYNC MANAGER</text>
  <text x="512" y="382" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="700">Connectivity Listener &amp; Multipart Queue Transmission</text>
  <text x="512" y="408" fill="#475569" font-family="sans-serif" font-size="13">Monitors network state changes and dispatches queued records with cryptographically</text>
  <text x="512" y="430" fill="#475569" font-family="sans-serif" font-size="13">unique UUIDv4 idempotency keys and ticket photos.</text>

  <rect x="484" y="490" width="624" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="512" y="526" fill="#1D4ED8" font-family="monospace" font-size="12">03. BACKEND &amp; DEDUPLICATION ENGINE</text>
  <text x="512" y="554" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="700">Node.js + Express + TypeScript API &amp; PostgreSQL</text>
  <text x="512" y="580" fill="#475569" font-family="sans-serif" font-size="13">Stores delivery ticket images in Vercel Blob and enforces UNIQUE(idempotency_key) in</text>
  <text x="512" y="602" fill="#475569" font-family="sans-serif" font-size="13">PostgreSQL so network retries never create duplicate delivery records.</text>
</svg>
